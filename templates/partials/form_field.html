<div class="{{ col|default:'col-12' }}">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check form-switch mt-2">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required-star">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
