{% extends "base.html" %}
{% block title %}رمز التحقق{% endblock %}
{% block body %}
<div class="login-form-wrap" style="min-height:100vh">
  <div class="card login-card"><div class="card-body text-center">
    <div class="brand-logo mx-auto mb-3" style="width:56px;height:56px"><i class="bi bi-phone"></i></div>
    <h5 class="fw-bold">أدخل رمز التحقق</h5>
    <p class="text-muted small">تم إرسال رمز مكون من 6 أرقام</p>
    <form method="post">{% csrf_token %}
      {{ form.code }}
      {% for e in form.code.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
      <button class="btn btn-brand w-100 mt-3">تحقق</button>
    </form>
    <a href="{% url 'accounts:login' %}" class="small d-block mt-3">العودة لتسجيل الدخول</a>
  </div></div>
</div>
{% endblock %}
